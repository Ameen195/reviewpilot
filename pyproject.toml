[project]
name = "reviewpilot"
version = "0.1.0"
description = "AI code review agent as a GitHub App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "langgraph>=1.2.23",
    "pydantic-settings>=2.16.3",
    "pygithub>=2.10.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
